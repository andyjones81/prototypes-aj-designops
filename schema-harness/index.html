<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firestarter Schema Harness</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-top">
        <h1 class="brand">Schema harness</h1>
        <div class="modes" role="tablist">
          <button type="button" role="tab" id="mode-types" data-mode="types" aria-selected="true" class="active">Entities</button>
          <button type="button" role="tab" id="mode-props" data-mode="props" aria-selected="false">Properties</button>
        </div>
        <input id="search" type="search" placeholder="Search entities, properties, comments" autocomplete="off" />
        <div class="filters">
          <select id="group-filter" aria-label="Filter by group">
            <option value="">All groups</option>
          </select>
          <select id="class-filter" aria-label="Filter by classification">
            <option value="">All classifications</option>
          </select>
          <label class="check"><input id="gaps-only" type="checkbox" /> Priority gaps only</label>
        </div>
        <div class="count-row">
          <p id="count" class="count" aria-live="polite"></p>
          <button id="toggle-all" type="button" class="toggle-all" aria-controls="type-list"></button>
        </div>
      </div>
      <nav id="type-list" class="type-list" aria-label="Entities and properties"></nav>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <script src="schema-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
